<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alpstay Angebot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Belleza&family=Lato:wght@300;400;700&display=swap">
<style>
/* Layout: stile AlpStay. Bianco, carbone e oro del logo; Belleza per i titoli, Lato per testo. Testata con foto, opzioni come "concetti", confronto. */
:root{
  --white:#ffffff; --panel:#f7f6f3; --ink:#2e2f2d; --muted:#6b6b67; --gold:#a68962; --gold-ink:#8a6f4b; --gold-light:#d9c1a0; --line:#e6e2db;
  --f-title:"Belleza","Century Gothic","Avenir Next",Arial,sans-serif; --f-body:"Lato","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--white);color:var(--ink);font:16px/1.65 var(--f-body);margin:0}
.inner{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ribbon{margin:0;background:var(--panel);color:var(--muted);text-align:center;font-size:13px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:var(--white);border-bottom:1px solid var(--line)}
.bar .inner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{height:64px;width:auto;display:block}
.bar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ref{font-size:12px;color:var(--muted);letter-spacing:.06em}
.langs{display:flex;gap:2px}
.langs button{font:400 12px var(--f-body);letter-spacing:.08em;background:none;border:1px solid transparent;border-radius:3px;padding:4px 8px;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
.hero{background-size:cover;background-position:68% center;background-color:#8a9497;position:relative;min-height:clamp(440px,72vh,800px);display:flex;align-items:flex-end}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(26,27,25,.74) 0%,rgba(26,27,25,.36) 36%,rgba(26,27,25,0) 62%),linear-gradient(90deg,rgba(26,27,25,.38) 0%,rgba(26,27,25,0) 58%)}
.hero .inner{position:relative;width:100%;box-sizing:border-box;padding-block:40px 46px;color:#fff}
.eyebrow{margin:0 0 14px;font:400 12px var(--f-body);letter-spacing:.34em;text-transform:uppercase;color:var(--gold-light)}
.hero h1{margin:0 0 14px;font:400 clamp(34px,5vw,54px)/1.1 var(--f-title);letter-spacing:.01em;max-width:17ch;text-wrap:balance}
.facts-line{margin:0;font:300 16px var(--f-body);opacity:.95}
main.inner{padding-block:44px 24px;display:flex;flex-direction:column;gap:48px}
.intro{margin:0;font:300 clamp(18px,2vw,21px)/1.6 var(--f-body);max-width:62ch}
.intro-wrap{display:flex;flex-direction:column;gap:14px}
.personal{margin:0;max-width:62ch;padding-left:16px;border-left:1px solid var(--gold);font:300 17px/1.6 var(--f-body);color:var(--ink)}
.opts{display:grid;gap:48px 56px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:stretch}
.opt{background:var(--white);display:flex;flex-direction:column;min-width:0}
.opt.rec{}
.badge{margin:0 0 14px;display:flex;align-items:center;gap:14px;font:400 11px var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.badge::after{content:"";flex:1;height:1px;background:var(--line)}
.opt.rec .badge{color:var(--gold-ink)}
.opt.rec .badge::after{background:var(--gold)}
/* Segnaposto finché mancano le foto: doghe di larice, vetrata e fascia in metallo scuro */
.opt-media{aspect-ratio:3/2;max-width:100%;position:relative;display:flex;align-items:flex-end;overflow:hidden;
  background:linear-gradient(to top,#2f302e 0 16%,transparent 16%),
  repeating-linear-gradient(90deg,#c9a77c 0 22px,#a98760 22px 24px,#d6b88f 24px 46px,#9f7d55 46px 48px,#c4a074 48px 70px,#a98760 70px 72px)}
.opt-media::after{content:"";position:absolute;left:12%;right:38%;top:16%;bottom:16%;border:5px solid #2f302e;border-bottom:0;
  background:linear-gradient(120deg,rgba(214,226,230,.55) 0%,rgba(120,140,148,.55) 45%,rgba(60,72,78,.7) 100%)}
.opt-media img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.opt-media span{position:relative;z-index:1;padding:7px 22px;font:400 17px var(--f-title);letter-spacing:.14em;text-transform:uppercase;color:#efe3cf}
@media (min-width:900px){.opts.n2{grid-template-columns:minmax(0,1.18fr) minmax(0,1fr)}}
.opt-body{padding:26px 0 10px;flex:1}
.concept{margin:0 0 8px;font:400 11px var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold-ink)}
.opt h2{margin:0;font:400 30px/1.2 var(--f-title);letter-spacing:.02em;text-wrap:balance}
.where{margin:4px 0 16px;color:var(--muted);font:300 14px var(--f-body);letter-spacing:.04em}
.tagline{margin:0 0 18px;font-weight:300}
.facts{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:9px}
.facts li{padding-left:24px;position:relative;font:300 15px var(--f-body)}
.facts li::before{content:"";position:absolute;left:0;top:.8em;width:12px;height:1px;background:var(--gold)}
.stay{margin:0;font:300 14px var(--f-body);color:var(--muted);letter-spacing:.03em}
.opt-price{padding:22px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.lbl{margin:0;font:400 11px var(--f-body);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.amount{margin:2px 0 0;font:400 36px/1.15 var(--f-title);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.amount.small{font-size:22px}
.pp{margin:0;font-size:14px}
.tax{margin:0;font-size:13px;color:var(--muted)}
.btn{margin-top:18px;align-self:flex-start;display:inline-block;text-align:center;background:transparent;color:var(--ink);border:1px solid var(--ink);text-decoration:none;font:400 12px var(--f-body);letter-spacing:.28em;text-transform:uppercase;padding:15px 30px;border-radius:0;transition:background .25s ease,color .25s ease}
.opt.rec .btn,.opts.n1 .opt .btn{background:var(--ink);color:#fff}
.opt:not(.rec) .btn:hover{background:var(--ink);color:#fff}
.opt.rec .btn:hover{background:#000}
.btn:focus-visible,.langs button:focus-visible,.copy:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.gallery h3{margin:0 0 16px;font:400 26px var(--f-title)}
.g-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.g-item{margin:0;position:relative;min-width:0}
.g-open{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:3px;overflow:hidden}
.g-open img{display:block;width:100%;aspect-ratio:3/2;max-width:100%;object-fit:cover;transition:transform .4s ease}
.g-open:hover img{transform:scale(1.03)}
.g-open:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.g-item figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;font:400 10px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:#fff;background:linear-gradient(to top,rgba(30,31,29,.72),rgba(30,31,29,0));pointer-events:none;border-radius:0 0 3px 3px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(24,25,23,.92);display:flex;align-items:center;justify-content:center;
  padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox figure{margin:0;max-width:1100px;width:100%;display:flex;flex-direction:column;gap:10px}
.lightbox img{width:100%;max-height:78vh;object-fit:contain}
.lightbox figcaption{color:#e9dcc6;font:400 13px var(--f-body);letter-spacing:.06em}
.lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font:400 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;background:none;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:2px;padding:7px 12px;cursor:pointer}
.compare h3,.help h3{margin:0 0 16px;font:400 26px var(--f-title)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font:400 20px var(--f-title);border-bottom:1px solid var(--gold)}
thead th span{display:block;font:400 13px var(--f-body);color:var(--muted)}
tbody th{font:400 12px var(--f-body);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;width:22%}
.help{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;border-top:1px solid var(--gold);border-bottom:1px solid var(--line);padding-block:28px}
.help p{margin:0}
.contact{display:flex;flex-direction:column;gap:8px}
.who{font:400 21px var(--f-title)}
.who span{display:block;font:400 13px var(--f-body);color:var(--muted)}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.val{font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere}
.copy{font:400 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--white);border-radius:2px;padding:4px 9px;cursor:pointer;color:var(--ink)}
.foot{margin-top:20px}
.foot .inner{padding-block:26px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.foot .tag{font:400 13px var(--f-title);letter-spacing:.18em;color:var(--gold-ink)}
.foot a{color:var(--muted)}
@media (max-width:640px){.help{grid-template-columns:minmax(0,1fr)}.hero .inner{padding-block:44px 40px}.brand{height:52px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.g-open:hover img{transform:none}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
